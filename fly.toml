app = 'webs-bot'
primary_region = 'ams'

[build]
  builder = 'paketobuildpacks/builder:base'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[processes]
  app = "python main.py"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
